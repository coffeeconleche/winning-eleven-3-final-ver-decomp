# Initial measured layout. File offsets include the 0x800-byte PS-X EXE header.
# The final 0x540 bytes are zero load padding. Runtime startup clears BSS from
# 0x800E6AC0 through 0x8011CE70, so the padding overlaps the beginning of the
# range that is immediately cleared and is kept as a separate binary segment.
segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    bss_size: 0x363B0
    subsegments:
      - [0x800, rodata]
      - [0x5EBC, c]
      - [0xB6874, data]
      - [0xD728C, sdata]
      - [0xD72C0]

  - [0xD72C0, bin, load_padding]
  - [0xD7800]
