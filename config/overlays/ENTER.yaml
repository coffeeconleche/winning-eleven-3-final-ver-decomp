name: ENTER.BIN
sha1: a7946495e695a25606c865aefe53d515d8cf1dda

options:
  basename: enter
  base_path: ../..
  target_path: extracted/modules/ENTER.BIN
  elf_path: build/overlays/enter/enter.elf
  platform: psx
  compiler: PSYQ

  asm_path: asm/overlays/enter
  src_path: src/overlays/enter
  build_path: build/overlays/enter
  generated_asm_macros_directory: include

  ld_script_path: config/overlays/enter.ld
  ld_dependencies: true
  find_file_boundaries: false
