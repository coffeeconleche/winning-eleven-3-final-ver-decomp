  undefined_funcs_auto_path: config/overlays/enter.undefined_funcs_auto.txt
  undefined_syms_auto_path: config/overlays/enter.undefined_syms_auto.txt

  string_encoding: SHIFT_JIS
  data_string_encoding: SHIFT_JIS
  rodata_string_guesser_level: 0
  data_string_guesser_level: 0

# Exact live match at 0x80188F78 during exhibition setup.
segments:
  - name: enter
    type: code
    start: 0x0
    vram: 0x80188F78
    subsegments:
      - [0x0, rodata]
      - [0x604, c]
      - [0x6E64, data]
      - [0xB784]
  - [0xB784]
